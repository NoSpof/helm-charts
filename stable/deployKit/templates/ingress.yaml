---
apiVersion: networking.k8s.io/v1                                                                                                                                                                        
kind: Ingress                                                                                                                                                                                           
metadata:                                                                                                                                                                                               
  annotations:                                                                                                                                                                                          
    cert-manager.io/cluster-issuer: letsencrypt                                                                                                                                                         
  labels:
    app: {{ .Values.appName }}
    contextId: {{ .Values.contextId}}
  name: {{ .Values.appName }}
  namespace: {{ .Values.contextId}}
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.appName }}-{{ .Values.contextId}}.nospof.cloud
    http:
      paths:
      - backend:
          service:
            name: {{ .Values.appName }}
            port:
              number: {{ .Values.internalPort}}
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - {{ .Values.appName }}-{{ .Values.contextId}}.nospof.cloud
    secretName: {{ .Values.appName }}
---