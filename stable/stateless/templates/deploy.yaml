apiVersion: apps/v1
kind: Deployment
metadata: 
  name: {{ .Values.applicationName}}
  labels:
    version: {{ .Values.revision }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.applicationName}}
  replicas: {{ default 1 .Values.replicaCount | int }}
  template:
    metadata:
      labels:
        app: {{ .Values.applicationName}}
    spec:
      containers:
      - name: {{ .Values.applicationName }}
        image: "{{ .Values.image }}"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.internalPort | int }}
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.internalPort | int }}
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.internalPort | int }}
        resources:
          limits:
            cpu: {{ .Values.resources.cpu | int }}
            memory: {{ .Values.resources.memory | int }}
          requests:
            cpu: {{ .Values.resources.cpu | int }}
            memory: {{ .Values.resources.memory | int }}